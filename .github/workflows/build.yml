name: Build DSI Desktop UI v0.14

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Expand desktop UI ZIP when present
        shell: bash
        run: |
          set -e
          archive=""
          for candidate in \
            DSI-Desktop-UI-v0.14-source*.zip \
            output/DSI-Desktop-UI-v0.14-source*.zip; do
            if [ -f "$candidate" ]; then
              archive="$candidate"
              break
            fi
          done
          if [ -n "$archive" ]; then
            mkdir -p .dsi-desktop-source
            unzip -q -o "$archive" -d .dsi-desktop-source
            project_root="$(find .dsi-desktop-source -type f -name settings.gradle -printf '%h\n' | head -n 1)"
            if [ -z "$project_root" ]; then
              echo "The ZIP does not contain an Android Gradle project"
              exit 1
            fi
            cp -a "$project_root"/. .
          fi
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/dsi/webviewtest/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build debug APK with retry
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon --stacktrace assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle attempt $attempt failed; retrying after 20 seconds"
              sleep 20
            fi
          done
          exit 1

      - name: Upload desktop UI APK
        uses: actions/upload-artifact@v4
        with:
          name: DSI-Desktop-UI-v0.14
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
