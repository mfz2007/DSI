name: Build DSI Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and expand DSI source ZIP
        shell: bash
        run: |
          set -e

          archive=""

          for candidate in \
            DSI-v0.14-dsi-avatar-test-source.zip \
            DSI-Desktop-UI-v0.14-source.zip \
            *source.zip \
            output/*source.zip
          do
            if [ -f "$candidate" ]; then
              archive="$candidate"
              break
            fi
          done

          if [ -z "$archive" ]; then
            echo "No DSI source ZIP found"
            exit 1
          fi

          echo "Using source archive: $archive"

          mkdir -p .dsi-source
          unzip -q -o "$archive" -d .dsi-source

          project_root="$(find .dsi-source -type f -name settings.gradle -printf '%h\n' | head -n 1)"

          if [ -z "$project_root" ]; then
            echo "Android Gradle project not found in ZIP"
            exit 1
          fi

          cp -a "$project_root"/. .

          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/dsi/webviewtest/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0
            platform-tools

