name: Build DSI WebView Diagnostic v4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Unpack v4 source
        run: |
          mkdir -p project
          unzip -q DSI-WebView-Test-diagnostic-v4.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle
          test -f project/app/src/main/AndroidManifest.xml

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build release APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Upload v4 APK
        uses: actions/upload-artifact@v4
        with:
          name: dsi-webview-test-v4
          path: project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
