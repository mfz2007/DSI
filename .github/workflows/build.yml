name: Build DSI WebView Test APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: 解压 v3 源码
        run: |
          mkdir project
          unzip -q DSI-WebView-Test-source-v3.zip -d project

      - name: 构建 APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: dsi-webview-test-v3
          path: project/app/build/outputs/apk/release/app-release.apk
