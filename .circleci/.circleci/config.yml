version: 2.1

jobs:
  check-environment:
    docker:
      - image: cimg/base:stable
    resource_class: large
    steps:
      - checkout
      - run:
          name: Inspect build resources
          command: |
            echo "=== CPU ==="
            nproc
            echo "=== Memory ==="
            free -h
            echo "=== Disk ==="
            df -h
            echo "Environment check complete."

workflows:
  environment-check:
    jobs:
      - check-environment
