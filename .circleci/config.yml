version: 2.1

jobs:
  check-environment:
    docker:
      - image: cimg/base:stable
    resource_class: large
    steps:
      - checkout
      - run:
          name: Chromium build environment check
          command: |
            echo "=== CPU ==="
            nproc
            cat /sys/fs/cgroup/cpu.max 2>/dev/null || true

            echo "=== Memory ==="
            free -h
            cat /sys/fs/cgroup/memory.max 2>/dev/null || true

            echo "=== Disk ==="
            df -h /
            df -i /

            echo "=== Limits ==="
            ulimit -a

            echo "=== System ==="
            uname -a

            echo "=== Finished ==="

workflows:
  environment-check:
    jobs:
      - check-environment